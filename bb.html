<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor</title>
    <style>
        body {
            background-color: #f9f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            border: 1px solid #ffccd5;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            line-height: 1.6;
            font-size: 18px;
            font-style: italic;
        }

        .heart {
            color: #e63946;
            font-size: 50px;
            margin-bottom: 10px;
            animation: beat 1.2s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤</div>
        <h1>Para mi esposa hermosa</h1>
        
        <p>
            "En este día de amor y amistad, quiero agradecerte por ser mi refugio y mi alegría. Eres la razón por la que cada día tiene un color diferente y más brillante. Gracias por ser mi mejor amiga y el gran amor de mi vida."
        </p>

        <div class="footer">
            Con todo mi amor siempre.
        </div>
    </div>

</body>
</html>
